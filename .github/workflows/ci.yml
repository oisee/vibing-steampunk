name: CI

# The point of this workflow is a cheap verdict on someone else's patch: does it
# build, vet clean, pass the tests, and add no new lint findings. It deliberately
# stays small — the heavy cross-platform work belongs to the release pipeline.
# Debt that predates a check (old lint findings, big functions) is measured and
# reported, never blocking.
# Nothing here talks to a SAP system: live tests sit behind the `integration` tag.
#
# One job per check, so each check is one row in the PR comment that
# ci-report.yml writes. This workflow stays read-only: almost every pull request
# here comes from a fork, and the comment is posted from the default branch by
# ci-report.yml, never from here.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # One pin for both lint jobs. A major version must move because someone moved
  # it: `latest` is what once broke lint here (v2 shipped, refused the v1
  # config, and the job "passed" in 67ms without reading a line of Go).
  # .github/ci/lint.sh refuses to run any other version, and the binary is
  # checked against this hash (from the release's checksums.txt) before use.
  GOLANGCI_LINT_VERSION: v2.13.2
  GOLANGCI_LINT_SHA256: 2277d43b98ec0054280f2ac26b53268bae97682444678a59a657dd565da021d6

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      # Cross-compilation only guards main; a release already builds all nine
      # targets, and PRs do not need to pay for it.
      - name: Cross-compile check
        if: github.event_name == 'push'
        run: |
          for target in linux/amd64 linux/386 windows/amd64; do
            GOOS=${target%/*} GOARCH=${target#*/} go build ./... || exit 1
          done

  vet:
    name: vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      # Compile the integration-tagged tests too, so a live test cannot rot
      # unnoticed just because CI never runs it.
      - name: Vet (integration tag)
        run: go vet -tags integration ./...

  test:
    name: test
    runs-on: ubuntu-latest
    env:
      # -shuffle runs each package's tests in a random order, so a test that
      # only passes after another one has set something up shows up here. The
      # seed is the run id rather than `on`, so it is known before the run, is
      # the same on a re-run, and goes into the log and the report row.
      SHUFFLE_SEED: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # -race costs about 40 s here and has already caught one real race (the
      # cookie jar swap fixed in #229). -json for the counts; it implies -v, so
      # the log is printed back the way plain `go test` would: package lines,
      # plus the output of the tests that failed.
      - name: Test
        run: |
          echo "shuffle seed $SHUFFLE_SEED"
          status=0
          go test -race -shuffle="$SHUFFLE_SEED" -json -coverprofile=cover.out ./... > test.json || status=$?
          jq -rsj '(map(select(.Action == "fail" and .Test != null) | .Package + " " + .Test)) as $failed
            | .[] | select(.Action == "output")
            | select(.Test == null or ((.Package + " " + .Test) as $k | $failed | index($k)))
            | select(.Output | startswith("-test.shuffle ") | not)
            | .Output' test.json
          echo "reproduce with: go test -race -shuffle=$SHUFFLE_SEED ./..."
          exit $status

      # One annotation the report reads back as the row's detail. Coverage is
      # over ./pkg/... only: cmd/ and internal/mcp move with whatever tool was
      # last registered, which makes a whole-repo total too noisy to compare.
      - name: Summarise
        if: always() && hashFiles('test.json') != ''
        run: |
          counts=$(jq -rs '[.[] | select(.Test != null and (.Action == "pass" or .Action == "fail" or .Action == "skip"))]
            | "\(map(select(.Action == "pass")) | length) passed, \(map(select(.Action == "fail")) | length) failed, \(map(select(.Action == "skip")) | length) skipped"' test.json)
          cov=""
          if [ -s cover.out ]; then
            { head -1 cover.out; grep '/pkg/' cover.out; } > cover-pkg.out
            cov=$(go tool cover -func=cover-pkg.out | awk '/^total:/ {print $3}')
          fi
          echo "::notice title=ci-report::${counts}${cov:+, pkg coverage $cov} · seed $SHUFFLE_SEED"

      # Per-package numbers for ci-report.yml, which compares them with the
      # last green run on main: tests, seconds and coverage, before and after.
      - name: Per-package summary
        if: always() && hashFiles('test.json') != ''
        run: |
          jq -s '
            group_by(.Package)[] | select(.[0].Package != null) | {
              pkg:     .[0].Package,
              pass:    (map(select(.Test != null and .Action == "pass")) | length),
              fail:    (map(select(.Test != null and .Action == "fail")) | length),
              skip:    (map(select(.Test != null and .Action == "skip")) | length),
              seconds: ((map(select(.Test == null and (.Action == "pass" or .Action == "fail")))[0].Elapsed) // null),
              cover:   ([.[] | select(.Test == null and .Action == "output") | .Output
                          | (capture("coverage: (?<c>[0-9.]+)% of statements") // empty) | .c | tonumber] | first)
            }' test.json | jq -s '{packages: .}' > test-summary.json
          jq -r '.packages | length' test-summary.json

      - name: Upload the summary
        if: always() && hashFiles('test-summary.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: test-summary
          path: test-summary.json
          retention-days: 30

  # A malformed SAP answer (an HTML error page where XML was due, a truncated
  # exception body, a corrupt cluster) must be an error, never a panic: a panic
  # mid-edit can leave the object's lock held. Thirty seconds each on the three
  # decoders that matter most; the seed corpus already runs in the test job,
  # and anything the fuzzer finds is uploaded for `go test -run` to replay.
  fuzz:
    name: fuzz (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Advisory: what a fuzzer finds in thirty seconds is often older than the
    # pull request it ran on, and must not block that PR. The crashers are
    # uploaded either way, and the seed corpus still gates in the test job.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Go takes one -fuzz pattern per package run, so one invocation each.
      # All three run even when one fails, so a run reports every crasher.
      # -fuzzminimizetime keeps a minimisation from outliving -fuzztime.
      - name: Fuzz
        run: |
          status=0
          for spec in ./pkg/adt:FuzzADTException ./pkg/abaplint:FuzzStatementParser ./pkg/datacluster:FuzzParse; do
            echo "::group::${spec##*:}"
            go test -run='^$' -fuzz="^${spec##*:}\$" -fuzztime=30s -fuzzminimizetime=10s "${spec%%:*}" || status=1
            echo "::endgroup::"
          done
          exit $status

      # A crasher is a new file under some testdata/fuzz directory.
      - name: Summarise
        if: always()
        run: |
          n=$(git status --porcelain --untracked-files=all -- '*testdata/fuzz/*' | wc -l)
          echo "::notice title=ci-report::fuzz 3×30s: ${n} crashers"

      - name: Upload crashers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashers
          path: pkg/**/testdata/fuzz/
          if-no-files-found: ignore

  # Policy: in CI only correctness and safety gates are red. Quality and style
  # (complexity, size, formatting) are advisory here, and can block only in the
  # opt-in pre-push hook (.githooks/pre-push).
  #
  # Blocking: red on any finding in code the change adds or touches, from five
  # correctness linters (errcheck, govet, ineffassign, staticcheck SA, unused;
  # config in .golangci.yml). The ~50 files with findings older than the gate
  # do not block anyone. Fails closed: a linter crash, config error, load
  # failure or timeout is red, and a canary package with one known finding per
  # linter must come back in the report, so "0 issues" can only mean the linter
  # ran and found nothing. Locally: ./.github/ci/lint.sh gate
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # The merge base with the base branch, to tell new code from old.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install golangci-lint
        run: |
          ./.github/ci/install-golangci-lint.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # On a push to main the merge base is the commit itself, so only the
      # canary is new: the run still proves the gate works on the main branch.
      - name: Lint new code
        env:
          BASE_REF: origin/${{ github.base_ref || github.ref_name }}
        run: ./.github/ci/lint.sh gate "$BASE_REF"

  # Safety gate, blocking: live SAP identifiers (hosts, addresses, SIDs, users)
  # and secrets (session cookies, basic auth, CSRF tokens, config passwords) in
  # what this change publishes. .github/ci/leakscan decodes every byte view of a
  # file (text, UTF-16LE, hex, base64) before matching. What it reads:
  #   pull request: the files it changes (as they are at its head), the lines
  #     every one of its commits added (so a value added and deleted again is
  #     still caught: it is in the history), and every commit message;
  #   push to main: every file in the tree, plus the lines and messages of the
  #     pushed range (event.before..event.after).
  # The allow-file is read from the base revision on a pull request, so a PR
  # cannot excuse its own hits; a PR that changes it gets a warning to review it.
  #
  # The identifier list is the VSP_LEAK_IDENTIFIERS secret (one value per line,
  # optionally `class: value`), masked line by line before anything runs. It is
  # expected on a push to this repository and on a pull request from a branch
  # of it, and its absence there is red (fail closed). A pull request from a
  # fork gets no secrets: it runs the generic patterns only, and the job says
  # so in a warning and in the report row, never as a plain pass.
  # Locally: the pre-push hook, or
  #   cd .github/ci/leakscan && go build -o /tmp/leakscan . && /tmp/leakscan -root ../../.. -diff origin/main
  leak-scan:
    name: leak scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # The merge base, to tell what the pull request adds.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: .github/ci/leakscan/go.mod
          cache: false

      - name: Test the scanner
        working-directory: .github/ci/leakscan
        run: go test ./...

      # Built, not `go run`: go run turns every non-zero exit into 1, and the
      # step below tells "hits" (1) from "fail closed" (2) from "partial" (3).
      - name: Build the scanner
        working-directory: .github/ci/leakscan
        run: go build -o "$RUNNER_TEMP/leakscan" .

      - name: Scan
        env:
          VSP_LEAK_IDENTIFIERS: ${{ secrets.VSP_LEAK_IDENTIFIERS }}
          EXPECTED: ${{ github.repository == 'oisee/vibing-steampunk' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) }}
          EVENT: ${{ github.event_name }}
          BASE_REF: origin/${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          # Mask every line, and the value after a `class:` prefix, before the
          # scanner (or anything else) can print one.
          while IFS= read -r line || [ -n "$line" ]; do
            line=${line%$'\r'}
            case $line in ''|'#'*) continue ;; esac
            echo "::add-mask::$line"
            value=$(printf '%s' "${line#*:}" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')
            [ -n "$value" ] && echo "::add-mask::$value"
          done <<< "$VSP_LEAK_IDENTIFIERS"

          require=()
          [ "$EXPECTED" = true ] && require=(-require-identifiers)
          allow_note=
          if [ "$EVENT" = pull_request ]; then
            mode=(-diff "$BASE_REF" -allow-rev "$BASE_REF")
            what="pull request's files, added lines and commit messages"
            if ! git diff --quiet "$(git merge-base "$BASE_REF" HEAD)" HEAD -- .github/ci/leakscan-allow.txt; then
              echo "::warning title=leak scan::This pull request changes .github/ci/leakscan-allow.txt. The scan used the base's allow-file; the new rules take effect only after merge, so review each one and its reason."
              allow_note="; allow-file changed, needs review"
            fi
          else
            mode=(-all)
            what="tree and the pushed commits"
            if [ -n "$BEFORE" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
              mode+=(-range "$BEFORE..$AFTER")
            elif git cat-file -e "${AFTER}^" 2>/dev/null; then
              # A new branch or a force push: no usable "before". The tip
              # commit at least; the tree scan covers every file.
              echo "::warning title=leak scan::No usable push base ($BEFORE); scanning the tree and the tip commit only."
              mode+=(-range "$AFTER^..$AFTER")
            fi
          fi
          status=0
          "$RUNNER_TEMP/leakscan" -root "$GITHUB_WORKSPACE" "${require[@]}" "${mode[@]}" || status=$?
          case $status in
            0) echo "::notice title=ci-report::full scan of the ${what}: clean${allow_note}" ;;
            3) echo "::warning title=leak scan::Identifier list unavailable (fork pull request, no secrets): only the generic patterns ran. Host, user and SID names were NOT checked; a maintainer's run on main checks them."
               echo "::notice title=ci-report::PARTIAL: generic patterns only, identifier list unavailable (fork)${allow_note}"
               { echo "### Leak scan: partial"; echo; echo "The identifier list (secret \`VSP_LEAK_IDENTIFIERS\`) is not available to a pull request from a fork, so only the generic patterns ran over the ${what}. Host, user and SID names were not checked."; } >> "$GITHUB_STEP_SUMMARY"
               ;;
            1) echo "::error title=leak scan::Possible leak in the ${what}: see the file:line list above. Replace the value with a placeholder; a value in a commit that a later commit removed is still in the history, so rewrite the branch. A generic false positive can be excused in .github/ci/leakscan-allow.txt, with a reason, in a pull request of its own."
               echo "::notice title=ci-report::hits in the ${what}${allow_note}"
               exit 1 ;;
            *) echo "::error title=leak scan::The scan could not run in full (exit $status), so it cannot pass. If the identifier list is missing, a repository admin must set the VSP_LEAK_IDENTIFIERS secret."
               echo "::notice title=ci-report::fail closed (exit $status)"
               exit "$status" ;;
          esac

  # Advisory: every linter in .github/ci/golangci-full.yml over the whole tree,
  # so the debt stays visible as one number per linter. New code over a
  # complexity threshold becomes a warning annotation, never an error. A crash or config error
  # still fails the job (it is advisory, so that is grey, not red).
  lint-full:
    name: lint (advisory, full)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          # The merge base, for the new-code complexity warnings.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install golangci-lint
        run: |
          ./.github/ci/install-golangci-lint.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Lint everything
        env:
          BASE_REF: origin/${{ github.base_ref || github.ref_name }}
        run: ./.github/ci/lint.sh full "$BASE_REF"

  # Advisory, observation only: size and complexity per package, file and
  # function (.github/ci/metrics). ci-report.yml compares the artifact with the
  # last green run on main and draws the trend from earlier main runs, which is
  # why it runs on pushes too and is kept for 90 days. Locally:
  #   cd .github/ci/metrics && go run . -root ../../.. -baseline ../complexity-baseline.json -o -
  metrics:
    name: metrics (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: .github/ci/metrics/go.sum

      - name: Test the metrics tool
        working-directory: .github/ci/metrics
        run: go test ./...

      - name: Measure
        working-directory: .github/ci/metrics
        run: |
          status=0
          go run . -root "$GITHUB_WORKSPACE" -baseline ../complexity-baseline.json -o "$GITHUB_WORKSPACE/metrics.json" 2> summary.txt || status=$?
          cat summary.txt
          [ "$status" -eq 0 ] || exit "$status"
          echo "::notice title=ci-report::$(tail -n 1 summary.txt)"

      - name: Upload the metrics
        uses: actions/upload-artifact@v4
        with:
          name: metrics
          path: metrics.json
          retention-days: 90

  fix-proven:
    name: fix proven (advisory)
    # Does a test the pull request adds fail without the pull request's code?
    # The PR's own tests are run against the base's non-test Go files; a test
    # that fails or does not compile there is one that proves the change. The
    # logic is in the script so it can be run locally:
    #   ./.github/ci/fix-proven.sh origin/main
    # Advisory: a refactor or a docs change proves nothing and is still fine.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # The merge base with the PR's base branch, and the base's files.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run the new tests against the base's code
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: ./.github/ci/fix-proven.sh "$BASE_REF" || true
