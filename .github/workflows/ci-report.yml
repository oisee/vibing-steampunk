name: CI report

# Writes one comment per pull request with a row per CI job, rewritten on every
# run rather than repeated, then asks Copilot for a review once the tests pass.
#
# This runs from the default branch, never from the pull request's branch, and
# that is what makes a write token safe here: almost every pull request to this
# repo comes from a fork, and a fork's `pull_request` run only ever gets a
# read-only token. So CI stays read-only and this reads its results afterwards.
# It must never check out, build or execute anything from the pull request.
#
# What it does read from the run — job names, the test job's annotation, the
# per-package test summary, the metrics file — comes from a workflow file the
# pull request can edit, so it is parsed defensively and escaped before it goes
# into the comment. The metrics of earlier main runs, for the trend, are read
# the same way, and the only program run on any of it is `unzip -p`, into
# memory under a size cap, after the zip's central directory has been checked
# against the same cap (see "Fetch the artifacts").
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  pull-requests: write
  actions: read
  checks: read

jobs:
  # Reads the run and builds the report. It writes nothing: the write job
  # below does, one at a time per pull request.
  comment:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      pr: ${{ steps.find.outputs.pr }}
      body: ${{ steps.report.outputs.body }}
    steps:
      # Same-repo pull requests arrive in run.pull_requests; fork ones do not,
      # so look them up by head branch. Either way, only report when the pull
      # request still points at the commit this run tested — a late run for an
      # old commit must not overwrite a newer report (the last step checks this
      # again, and that this is the latest run and attempt on the commit). The
      # base is the last green push run on the pull request's base branch.
      - name: Find the pull request and the base run
        id: find
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const run = context.payload.workflow_run;
            let pr = run.pull_requests?.[0];
            if (pr) {
              pr = (await github.rest.pulls.get({ owner, repo, pull_number: pr.number })).data;
            } else {
              const open = await github.paginate(github.rest.pulls.list,
                { owner, repo, state: 'open', head: `${run.head_repository.owner.login}:${run.head_branch}` });
              pr = open.find((p) => p.head.sha === run.head_sha);
            }
            if (!pr || pr.head.sha !== run.head_sha) {
              core.info(`no open pull request at ${run.head_sha}; nothing to report`);
              return;
            }
            core.setOutput('pr', String(pr.number));
            core.setOutput('base_ref', pr.base.ref);
            const base = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id: 'ci.yml', branch: pr.base.ref, event: 'push', status: 'success', per_page: 1,
            }).then((r) => r.data.workflow_runs[0]).catch(() => undefined);
            if (base) {
              core.setOutput('base_run', String(base.id));
              core.setOutput('base_sha', base.head_sha);
            }

      # The pull request's own artifacts are written by its own workflow, so a
      # fork controls them: a small zip can unpack to gigabytes. So nothing is
      # extracted on trust. Each archive is fetched as a zip, under a cap on its
      # zipped size; its central directory is read here, in JavaScript, and an
      # archive whose entries add up to more than the unzipped cap, or hold one
      # over it, is refused; then only the expected file is unpacked, with
      # `unzip -p` into memory under the same cap (the child is killed past it,
      # whatever the headers claimed), and written out by this script. The base
      # artifacts go through the same path. Real sizes: test-summary about
      # 1 KB, metrics about 15 KB, zipped.
      - name: Fetch the artifacts
        if: steps.find.outputs.pr != ''
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          BASE_RUN: ${{ steps.find.outputs.base_run }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const { execFileSync } = require('child_process');
            const { owner, repo } = context.repo;
            const KB = 1024, MB = 1024 * KB;
            const kinds = [
              { name: 'test-summary', file: 'test-summary.json', zip: 256 * KB, raw: 1 * MB, head: 'head', base: 'base' },
              { name: 'metrics', file: 'metrics.json', zip: 1 * MB, raw: 8 * MB, head: 'head-metrics', base: 'base-metrics' },
            ];
            const runs = [{ id: context.payload.workflow_run.id, side: 'head' }];
            if (/^\d+$/.test(process.env.BASE_RUN || '')) runs.push({ id: Number(process.env.BASE_RUN), side: 'base' });

            // The central directory, read without running anything on the zip.
            // A zip64 archive (sizes past 4 GiB) is refused outright.
            const centralDirectory = (buf) => {
              if (buf.length < 22) throw new Error('not a zip');
              let eocd = -1;
              for (let i = buf.length - 22; i >= Math.max(0, buf.length - 22 - 0xffff); i--) {
                if (buf.readUInt32LE(i) === 0x06054b50) { eocd = i; break; }
              }
              if (eocd < 0) throw new Error('not a zip: no end of central directory');
              const count = buf.readUInt16LE(eocd + 10);
              if (count === 0xffff) throw new Error('zip64 archive refused');
              let p = buf.readUInt32LE(eocd + 16);
              const entries = [];
              for (let n = 0; n < count; n++) {
                if (p + 46 > buf.length || buf.readUInt32LE(p) !== 0x02014b50) throw new Error('malformed central directory');
                const size = buf.readUInt32LE(p + 24);
                const nameLen = buf.readUInt16LE(p + 28), extraLen = buf.readUInt16LE(p + 30), commentLen = buf.readUInt16LE(p + 32);
                if (size === 0xffffffff) throw new Error('zip64 entry refused');
                if (p + 46 + nameLen > buf.length) throw new Error('malformed central directory');
                entries.push({ name: buf.toString('latin1', p + 46, p + 46 + nameLen), size });
                p += 46 + nameLen + extraLen + commentLen;
              }
              return entries;
            };

            for (const run of runs) {
              let arts = [];
              try {
                arts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, { owner, repo, run_id: run.id });
              } catch (e) { core.warning(`${run.side} run ${run.id}: artifacts not listed: ${e.message}`); continue; }
              for (const k of kinds) {
                const label = `${run.side} ${k.name}`;
                try {
                  const a = arts.find((x) => x.name === k.name && !x.expired);
                  if (!a) { core.info(`${label}: no artifact`); continue; }
                  if (a.size_in_bytes > k.zip) throw new Error(`${a.size_in_bytes} bytes zipped, over the ${k.zip}-byte cap`);
                  const res = await github.rest.actions.downloadArtifact({ owner, repo, artifact_id: a.id, archive_format: 'zip' });
                  const buf = Buffer.from(res.data);
                  if (buf.length > k.zip) throw new Error(`${buf.length} bytes zipped, over the ${k.zip}-byte cap`);
                  const entries = centralDirectory(buf);
                  const total = entries.reduce((s, e) => s + e.size, 0);
                  const big = entries.find((e) => e.size > k.raw);
                  if (big || total > k.raw) throw new Error(`unpacks to ${total} bytes${big ? ' (one entry ' + big.size + ')' : ''}, over the ${k.raw}-byte cap`);
                  if (!entries.some((e) => e.name === k.file)) throw new Error(`no ${k.file} in the archive`);
                  const zipPath = path.join(process.env.RUNNER_TEMP, `${run.side}-${k.name}.zip`);
                  fs.writeFileSync(zipPath, buf);
                  // Bounded whatever the headers say: past maxBuffer the child
                  // is killed and this throws. Nothing touches the disk but the
                  // one file, written by this script.
                  const data = execFileSync('unzip', ['-p', zipPath, k.file], { maxBuffer: k.raw, timeout: 60000 });
                  fs.mkdirSync(k[run.side], { recursive: true });
                  fs.writeFileSync(path.join(k[run.side], k.file), data);
                  core.info(`${label}: ${buf.length} bytes zipped, ${data.length} unpacked`);
                } catch (e) {
                  core.warning(`${label}: not used: ${e.message}`);
                }
              }
            }

      # Size and complexity, base → head, and the trend over the last green
      # runs on the base branch. Advisory: whatever happens here, the report
      # below is still written, without this section if need be.
      - name: Write the complexity section
        if: steps.find.outputs.pr != ''
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          BASE_REF: ${{ steps.find.outputs.base_ref }}
        with:
          script: |
            // Advisory, observation only: nothing here can fail the run. The
            // section is written to complexity.md and the next step appends it.
            const fs = require('fs');
            const { execFileSync } = require('child_process');
            const { owner, repo } = context.repo;
            const MAX_BYTES = 8 * 1024 * 1024; // unzipped metrics.json
            const MAX_ZIP = 1024 * 1024;       // zipped artifact
            const TREND_RUNS = 10;

            // The head metrics come from the pull request's own workflow, so
            // they are data: only finite non-negative numbers and short strings
            // survive, and every string is escaped before it reaches markdown.
            // Escaped for markdown, and defused: a zero-width space after `@`
            // stops a fork from pinging users or teams through the bot, and one
            // inside `://`, `www.` and `#<digit>` stops autolinks and issue
            // cross-references.
            const clean = (s, max = 120) => String(s ?? '')
              .replace(/[\r\n]+/g, ' ').slice(0, max)
              .replace(/[|<>`[\]*_\\]/g, (c) => '\\' + c)
              .replace(/@/g, '@\u200B').replace(/:\/\//g, ':\u200B//')
              .replace(/\bwww\./gi, (w) => w.slice(0, 3) + '\u200B.').replace(/#(?=\d)/g, '#\u200B');
            // Inside a code span only a backtick, a newline or (in a table) a
            // pipe can break out. Backslash escapes would show literally, so a
            // pipe is escaped only in a table cell, where GFM needs it. Code
            // spans neither mention nor autolink.
            const code = (s, max = 100, cell = false) => {
              const t = String(s ?? '').replace(/[\r\n`]+/g, ' ').slice(0, max);
              return '`' + (cell ? t.replace(/\|/g, '\\|') : t) + '`';
            };
            const num = (v) => (typeof v === 'number' && Number.isFinite(v) && v >= 0 && v < 1e12) ? Math.round(v) : 0;
            const str = (v) => (typeof v === 'string' && v.length > 0 && v.length <= 300) ? v : null;
            const list = (v, n) => Array.isArray(v) ? v.slice(0, n) : [];
            const COUNTS = ['files', 'lines', 'tokens', 'funcs', 'cognitive', 'over_cyclomatic', 'over_cognitive',
              'over_func_lines', 'files_over_lines', 'files_over_tokens', 'files_over_tokens_warn'];
            const counts = (c) => Object.fromEntries(COUNTS.map((k) => [k, num(c?.[k])]));
            const parse = (text) => {
              const raw = JSON.parse(text);
              if (raw?.schema !== 1) return null;
              const totals = { ...counts(raw.totals), test: counts(raw.totals?.test) };
              const th = raw.thresholds || {};
              const thresholds = { cyclomatic: num(th.cyclomatic) || 30, cognitive: num(th.cognitive) || 40,
                func_lines: num(th.func_lines) || 150, file_lines: num(th.file_lines) || 1000,
                file_tokens: num(th.file_tokens) || 25000, file_tokens_warn: num(th.file_tokens_warn) || 15000 };
              const sized = (arr, keyName, n) => {
                const out = new Map();
                for (const x of list(arr, n)) {
                  const k = str(x?.[keyName]);
                  if (k && x.research !== true && x.test !== true) out.set(k, { lines: num(x.lines), tokens: num(x.tokens), cognitive: num(x.cognitive) });
                }
                return out;
              };
              const fn = (x) => ({ key: str(x?.key), file: str(x?.file) || '', line: num(x?.line),
                cyclomatic: num(x?.cyclomatic), cognitive: num(x?.cognitive), lines: num(x?.lines) });
              const over = new Map();
              for (const x of list(raw.over_threshold, 5000)) {
                const f = fn(x);
                if (f.key && x.research !== true) over.set(f.key, f);
              }
              const items = (arr) => list(arr, 300).map((x) => ({ path: str(x?.path), lines: num(x?.lines), baseline: num(x?.baseline_lines) }))
                .filter((x) => x.path);
              const ratchet = raw.ratchet && typeof raw.ratchet === 'object'
                ? { baseline: str(raw.ratchet.baseline) || '', files: items(raw.ratchet.files), packages: items(raw.ratchet.packages) }
                : null;
              return { totals, thresholds, ratchet, over,
                commit: str(raw.commit) || '',
                research: num(raw.research_totals?.tokens),
                files: sized(raw.files, 'path', 20000),
                packages: sized(raw.packages, 'pkg', 2000),
                top: list(raw.top_cognitive, 10).map(fn).filter((f) => f.key) };
            };
            const load = (p) => {
              try {
                if (fs.statSync(p).size > MAX_BYTES) return null;
                return parse(fs.readFileSync(p, 'utf8'));
              } catch { return null; }
            };

            // The last green runs on the base branch, oldest first. Each one is
            // a metrics artifact from a push to that branch.
            const trend = async () => {
              const out = [];
              try {
                const runs = (await github.rest.actions.listWorkflowRuns({ owner, repo, workflow_id: 'ci.yml',
                  branch: process.env.BASE_REF, event: 'push', status: 'success', per_page: 2 * TREND_RUNS })).data.workflow_runs;
                for (const r of runs) {
                  if (out.length >= TREND_RUNS) break;
                  try {
                    const arts = (await github.rest.actions.listWorkflowRunArtifacts({ owner, repo, run_id: r.id, name: 'metrics' })).data.artifacts;
                    const a = arts.find((x) => x.name === 'metrics' && !x.expired && x.size_in_bytes <= MAX_ZIP);
                    if (!a) continue;
                    const zip = await github.rest.actions.downloadArtifact({ owner, repo, artifact_id: a.id, archive_format: 'zip' });
                    const file = `trend-${num(r.id)}.zip`;
                    fs.writeFileSync(file, Buffer.from(zip.data));
                    const m = parse(execFileSync('unzip', ['-p', file, 'metrics.json'], { maxBuffer: MAX_BYTES }).toString('utf8'));
                    if (m) out.push(m.totals);
                  } catch (e) { core.info(`trend: run ${r.id}: ${e.message}`); }
                }
              } catch (e) { core.info(`trend: ${e.message}`); }
              return out.reverse();
            };

            const k = (v) => (v >= 1e6 ? (v / 1e6).toFixed(3) + 'M' : v >= 1e3 ? (v / 1e3).toFixed(1) + 'k' : String(v))
              .replace(/\.0+([kM])$/, '$1');
            const n = (v) => v.toLocaleString('en-US');
            const signed = (d, fmt = String) => d > 0 ? '+' + fmt(d) : d < 0 ? '-' + fmt(-d) : '±0';
            const spark = (vals) => {
              const bars = '▁▂▃▄▅▆▇█';
              const lo = Math.min(...vals), hi = Math.max(...vals);
              return vals.map((v) => bars[hi === lo ? 3 : Math.round((v - lo) / (hi - lo) * 7)]).join('');
            };

            const head = load('head-metrics/metrics.json');
            const base = load('base-metrics/metrics.json');
            const out = ['', '#### Complexity (advisory)'];
            if (!head) {
              out.push('', '_No metrics from this run: the metrics job did not finish, or its output was unreadable._');
              fs.writeFileSync('complexity.md', out.join('\n'));
              return;
            }
            const th = head.thresholds;
            const crosses = (f) => [
              f.cyclomatic > th.cyclomatic && `cyclomatic ${f.cyclomatic}`,
              f.cognitive > th.cognitive && `cognitive ${f.cognitive}`,
              f.lines > th.func_lines && `${f.lines} lines`].filter(Boolean);
            const kinds = (f) => [f.cyclomatic > th.cyclomatic && 'cyc', f.cognitive > th.cognitive && 'cog',
              f.lines > th.func_lines && 'len'].filter(Boolean);
            const where = (f) => `${clean(f.file, 80)}:${f.line}`;
            const ht = head.totals;
            const testLine = (t) => `${k(t.lines)} lines; over cyclomatic ${th.cyclomatic} / cognitive ${th.cognitive} / ${th.func_lines} lines: `
              + `${t.over_cyclomatic} / ${t.over_cognitive} / ${t.over_func_lines}; files over ${n(th.file_lines)} lines: ${t.files_over_lines}`;

            if (base) {
              const bt = base.totals;
              const d = (key) => ht[key] - bt[key];
              // Files that crossed a size line in this PR (were under it, or new).
              const crossedOver = (key, limit) => [...head.files].filter(([p, f]) => f[key] > limit && !((base.files.get(p)?.[key] ?? 0) > limit)).map(([p]) => p);
              const c25 = crossedOver('tokens', th.file_tokens), c15 = crossedOver('tokens', th.file_tokens_warn),
                c1000 = crossedOver('lines', th.file_lines);
              out.push('', `**drift: ${signed(d('tokens'), k)} read tokens, ${signed(d('over_cognitive'))} functions over cognitive ${th.cognitive}, `
                + `${signed(d('over_cyclomatic'))} over cyclomatic ${th.cyclomatic}, ${signed(d('over_func_lines'))} over ${th.func_lines} lines; `
                + `${c25.length} files crossed ${k(th.file_tokens)} tokens (${c15.length} crossed ${k(th.file_tokens_warn)}), `
                + `${c1000.length} crossed ${n(th.file_lines)} lines**`);
              const row = (label, key, fmt = String) => `| ${label} | ${fmt(bt[key])} | ${fmt(ht[key])} | ${signed(d(key), fmt)} |`;
              out.push('', `| Non-test Go, research packages excluded | base ${code(base.commit.slice(0, 8), 8, true)} | head | Δ |`,
                '| --- | --- | --- | --- |',
                row('Read tokens (bytes/4)', 'tokens', k),
                row('Lines', 'lines', k),
                row('Functions', 'funcs'),
                row('Cognitive complexity, sum', 'cognitive', k),
                row(`Functions over cognitive ${th.cognitive}`, 'over_cognitive'),
                row(`Functions over cyclomatic ${th.cyclomatic}`, 'over_cyclomatic'),
                row(`Functions over ${th.func_lines} lines`, 'over_func_lines'),
                row(`Files over ${n(th.file_lines)} lines`, 'files_over_lines'),
                row(`Files over ${k(th.file_tokens)} tokens`, 'files_over_tokens'),
                row(`Files over ${k(th.file_tokens_warn)} tokens (warning)`, 'files_over_tokens_warn'));
              for (const p of c25) out.push(`- crossed ${k(th.file_tokens)} tokens: ${code(p)}`);
              for (const p of c15.filter((p) => !c25.includes(p))) out.push(`- crossed ${k(th.file_tokens_warn)} tokens (warning): ${code(p)}`);
              out.push('', testLine(bt.test) === testLine(ht.test)
                ? `Test code, numbers only, unchanged: ${testLine(ht.test)}.`
                : `Test code, numbers only: ${testLine(bt.test)} → ${testLine(ht.test)}.`);

              // Functions that crossed a threshold they were under at the base,
              // and those that left one (a split gets the credit).
              const newly = [], left = [];
              for (const [key, f] of head.over) {
                const was = new Set(base.over.has(key) ? kinds(base.over.get(key)) : []);
                if (kinds(f).some((x) => !was.has(x))) newly.push(f);
              }
              for (const [key, f] of base.over) {
                const now = new Set(head.over.has(key) ? kinds(head.over.get(key)) : []);
                if (kinds(f).some((x) => !now.has(x))) left.push({ f, gone: !head.over.has(key) });
              }
              if (newly.length) {
                out.push('', `Newly over a threshold (${newly.length}):`);
                for (const f of newly.slice(0, 15)) out.push(`- ${code(f.key)} ${where(f)}: ${crosses(f).join(', ')}`);
              }
              if (left.length) {
                out.push('', `Back under a threshold (${left.length}):`);
                for (const { f, gone } of left.slice(0, 15)) {
                  out.push(`- ${code(f.key)}: was ${crosses(f).join(', ')}; ${gone ? 'now under every threshold, or moved' : 'now ' + crosses(head.over.get(f.key)).join(', ')}`);
                }
              }

              // Files and packages that moved the most, both ways.
              const moves = (hm, bm) => {
                const rows = [];
                for (const name of new Set([...hm.keys(), ...bm.keys()])) {
                  const z = { lines: 0, tokens: 0, cognitive: 0 };
                  const h = hm.get(name) || z, b = bm.get(name) || z;
                  const dt = h.tokens - b.tokens, dc = h.cognitive - b.cognitive;
                  if (dt || dc) rows.push({ name, h, b, dt, dc, added: !bm.has(name), removed: !hm.has(name) });
                }
                return rows;
              };
              const table = (title, rows) => {
                if (!rows.length) return;
                out.push('', title, '', '| | Tokens | Δ tokens | Δ cognitive |', '| --- | --- | --- | --- |',
                  ...rows.map((r) => `| ${code(r.name, 90, true)}${r.added ? ' (new)' : r.removed ? ' (removed)' : ''} | ${k(r.b.tokens)} → ${k(r.h.tokens)} | ${signed(r.dt, k)} | ${signed(r.dc)} |`));
              };
              const grew = (rows) => rows.filter((r) => r.dt > 0 || (r.dt === 0 && r.dc > 0))
                .sort((a, b) => b.dt - a.dt || b.dc - a.dc).slice(0, 8);
              const shrank = (rows) => rows.filter((r) => r.dt < 0 || (r.dt === 0 && r.dc < 0))
                .sort((a, b) => a.dt - b.dt || a.dc - b.dc).slice(0, 8);
              const fileMoves = moves(head.files, base.files), pkgMoves = moves(head.packages, base.packages);
              if (fileMoves.length || pkgMoves.length) {
                out.push('', `<details><summary>What moved: ${fileMoves.length} files, ${pkgMoves.length} packages</summary>`);
                table('**Packages that grew**', grew(pkgMoves));
                table('**Packages that shrank**', shrank(pkgMoves));
                table('**Files that grew**', grew(fileMoves));
                table('**Files that shrank**', shrank(fileMoves));
                out.push('', '</details>');
              } else {
                out.push('', 'No non-test Go file changed size or complexity.');
              }
            } else {
              out.push('', `_No metrics from the base run to compare with yet (the base predates the metrics job)._ Head: `
                + `${k(ht.tokens)} read tokens in ${ht.files} files; ${ht.over_cognitive} functions over cognitive ${th.cognitive}, `
                + `${ht.over_cyclomatic} over cyclomatic ${th.cyclomatic}, ${ht.over_func_lines} over ${th.func_lines} lines; `
                + `${ht.files_over_lines} files over ${n(th.file_lines)} lines, ${ht.files_over_tokens} over ${k(th.file_tokens)} tokens `
                + `(${ht.files_over_tokens_warn} over ${k(th.file_tokens_warn)}). Test code, numbers only: ${testLine(ht.test)}.`);
            }

            // Size ratchet, a warning only for now: no file newly over the line
            // threshold, and no file or package past the committed baseline or
            // past its size on main, whichever is smaller (a shrink tightens it
            // without anyone editing the baseline). Files only when this PR
            // changed them, so an old overrun is not pinned on whoever is next.
            if (head.ratchet) {
              const warn = [];
              const touched = (bm, name, lines) => !base || (bm.get(name)?.lines ?? -1) !== lines;
              for (const f of head.ratchet.files) {
                const onMain = base?.files.get(f.path)?.lines;
                const limit = Math.min(f.baseline || Infinity, onMain > th.file_lines ? onMain : Infinity);
                if (!touched(base?.files, f.path, f.lines)) continue;
                if (limit === Infinity) warn.push(`- new over ${n(th.file_lines)} lines: ${code(f.path)}, ${f.lines} lines`);
                else if (f.lines > limit) warn.push(`- grew: ${code(f.path)}, ${limit} → ${f.lines} lines (${signed(f.lines - limit)})`);
              }
              for (const p of head.ratchet.packages) {
                // The same rule as files: the smaller of the baseline and main.
                const onMain = base?.packages.get(p.path)?.lines;
                const limit = Math.min(p.baseline, onMain ?? Infinity);
                if (p.lines > limit && touched(base?.packages, p.path, p.lines)) {
                  warn.push(`- package grew: ${code(p.path)}, ${limit} → ${p.lines} lines (${signed(p.lines - limit)})`);
                }
              }
              out.push('', warn.length
                ? `**Size ratchet (warning only):** past the baseline of ${clean(head.ratchet.baseline, 40)}. If the growth is meant, raise the number in \`.github/ci/complexity-baseline.json\` in this PR, so the reason is in the diff.`
                : `Size ratchet: nothing this PR changed is past the baseline of ${clean(head.ratchet.baseline, 40)}.`, ...warn.slice(0, 20));
            }

            const series = await trend();
            if (series.length >= 2) {
              const line = (label, key, fmt = String) => {
                const vals = series.map((t) => t[key]);
                return `| ${label} | ${spark([...vals, ht[key]])} | ${fmt(vals[0])} → ${fmt(vals[vals.length - 1])} | ${fmt(ht[key])} |`;
              };
              out.push('', `<details><summary>Trend: the last ${series.length} green runs on ${clean(process.env.BASE_REF, 40)}, then this PR</summary>`, '',
                `| | Trend | ${clean(process.env.BASE_REF, 40)}, oldest → newest | This PR |`, '| --- | --- | --- | --- |',
                line('Read tokens', 'tokens', k),
                line(`Over cognitive ${th.cognitive}`, 'over_cognitive'),
                line(`Over cyclomatic ${th.cyclomatic}`, 'over_cyclomatic'),
                line(`Over ${th.func_lines} lines`, 'over_func_lines'),
                line(`Files over ${n(th.file_lines)} lines`, 'files_over_lines'),
                line(`Files over ${k(th.file_tokens)} tokens`, 'files_over_tokens'),
                '', '</details>');
            }

            if (head.top.length) {
              out.push('', '<details><summary>Top 10 functions by cognitive complexity</summary>', '',
                '| Function | Where | Cognitive | Cyclomatic | Lines |', '| --- | --- | --- | --- | --- |',
                ...head.top.map((f) => `| ${code(f.key, 90, true)} | ${where(f)} | ${f.cognitive} | ${f.cyclomatic} | ${f.lines} |`),
                '', '</details>');
            }
            if (head.research) out.push('', `_Research packages, kept out of every number above: ${k(head.research)} read tokens._`);
            out.push('', `_Thresholds, as in the 2026-10-02 complexity map: cyclomatic > ${th.cyclomatic}, cognitive > ${th.cognitive}, `
              + `function > ${th.func_lines} lines, file > ${n(th.file_lines)} lines, file > ${k(th.file_tokens)} tokens (warning at ${k(th.file_tokens_warn)}). `
              + 'Observation only; nothing here fails a build._');
            fs.writeFileSync('complexity.md', out.join('\n'));

      - name: Build the report
        id: report
        if: steps.find.outputs.pr != ''
        uses: actions/github-script@v7
        env:
          BASE_SHA: ${{ steps.find.outputs.base_sha }}
          BASE_REF: ${{ steps.find.outputs.base_ref }}
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const run = context.payload.workflow_run;

            // Escaped for markdown, and defused: a zero-width space after `@`
            // stops a fork from pinging users or teams through the bot, and one
            // inside `://`, `www.` and `#<digit>` stops autolinks and issue
            // cross-references.
            const clean = (s, max = 120) => String(s ?? '')
              .replace(/[\r\n]+/g, ' ').slice(0, max)
              .replace(/[|<>`[\]*_\\]/g, (c) => '\\' + c)
              .replace(/@/g, '@\u200B').replace(/:\/\//g, ':\u200B//')
              .replace(/\bwww\./gi, (w) => w.slice(0, 3) + '\u200B.').replace(/#(?=\d)/g, '#\u200B');
            const icon = (v) => ({
              success: '🟢 pass', failure: '🔴 fail', cancelled: '⚫ cancelled',
              skipped: '⚪ skipped', timed_out: '🔴 timed out',
            })[v] || '⚪ ' + clean(v || 'not run', 30);
            const took = (j) => (j.started_at && j.completed_at)
              ? `${Math.round((new Date(j.completed_at) - new Date(j.started_at)) / 1000)} s` : '';

            // --- one row per job --------------------------------------------
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRunAttempt,
              { owner, repo, run_id: run.id, attempt_number: run.run_attempt });
            const rows = [];
            for (const j of jobs) {
              // Advisory jobs never gate; do not paint them red.
              // "(advisory)" and "(advisory, full)" both count.
              const result = /\(advisory\b/.test(j.name)
                ? '⚪ advisory: ' + (j.conclusion || 'not run')
                : icon(j.conclusion);
              // A job id is its check run id; the test job leaves its counts
              // there as an annotation titled ci-report.
              let detail = '';
              if (j.conclusion && j.conclusion !== 'skipped') {
                const notes = await github.rest.checks.listAnnotations({ owner, repo, check_run_id: j.id })
                  .then((r) => r.data).catch(() => []);
                detail = notes.find((a) => a.title === 'ci-report')?.message || '';
              }
              rows.push(`| ${clean(j.name, 60)} | ${result} | ${clean(detail)} | ${took(j)} |`);
            }

            // --- tests per package, before → after --------------------------
            // The head summary was written by the pull request's own workflow:
            // keep only well-formed numbers and short package names.
            const load = (dir) => {
              try {
                if (fs.statSync(`${dir}/test-summary.json`).size > 1024 * 1024) return null;
                const raw = JSON.parse(fs.readFileSync(`${dir}/test-summary.json`, 'utf8'));
                const out = new Map();
                for (const p of (raw.packages || []).slice(0, 500)) {
                  if (typeof p?.pkg !== 'string' || p.pkg.length > 200) continue;
                  const num = (v) => (typeof v === 'number' && Number.isFinite(v) && v >= 0) ? v : null;
                  out.set(p.pkg, { pass: num(p.pass) ?? 0, fail: num(p.fail) ?? 0, skip: num(p.skip) ?? 0,
                    seconds: num(p.seconds), cover: num(p.cover) });
                }
                return out;
              } catch { return null; }
            };
            const head = load('head');
            const base = load('base');
            const short = (pkg) => pkg.replace(/^github\.com\/oisee\/vibing-steampunk\//, '');
            const secs = (v) => v == null ? '—' : `${v.toFixed(1)} s`;
            const total = (v) => v < 100 ? v.toFixed(1) : v.toFixed(0);
            const sum = (m, k) => [...m.values()].reduce((a, p) => a + (p[k] || 0), 0);
            const delta = (b, a, unit = '') => {
              if (b == null || a == null) return '';
              const d = a - b;
              if (Math.abs(d) < (unit === ' s' ? 0.5 : 0.05)) return '';
              return ` (${d > 0 ? '+' : ''}${unit === ' s' ? d.toFixed(1) : d.toFixed(1)}${unit})`;
            };
            const testLines = [];
            if (head) {
              const hp = sum(head, 'pass'), hf = sum(head, 'fail'), hs = sum(head, 'skip'), ht = sum(head, 'seconds');
              const bp = base ? sum(base, 'pass') : null, bt = base ? sum(base, 'seconds') : null;
              const baseRef = process.env.BASE_SHA ? `\`${process.env.BASE_SHA.slice(0, 8)}\`` : 'base';
              // The pull request's base branch, which is not always main.
              const baseName = process.env.BASE_REF ? '`' + process.env.BASE_REF.replace(/[\r\n`]+/g, ' ').slice(0, 60) + '`' : 'the base branch';
              testLines.push(base
                ? `**Tests:** ${bp} → **${hp}** passed${hp - bp ? ` (${hp - bp > 0 ? '+' : ''}${hp - bp})` : ''}, ${hf} failed, ${hs} skipped · package time ${total(bt)} s → ${total(ht)} s, compared with ${baseRef} on ${baseName}`
                : `**Tests:** ${hp} passed, ${hf} failed, ${hs} skipped · package time ${total(ht)} s (no base run to compare with yet)`);
              const names = [...new Set([...head.keys(), ...(base ? base.keys() : [])])];
              const table = names.map((n) => {
                const h = head.get(n), b = base?.get(n);
                const tests = (p) => p ? p.pass + p.fail : null;
                const status = !h ? '➖ removed' : h.fail ? '🔴' : (!b ? '🆕' : '🟢');
                const changed = !b || !h || tests(b) !== tests(h) || (h && h.fail)
                  || Math.abs((h?.seconds ?? 0) - (b?.seconds ?? 0)) >= 0.5
                  || Math.abs((h?.cover ?? 0) - (b?.cover ?? 0)) >= 0.05;
                return { n, h, b, status, changed,
                  row: `| ${clean(short(n), 60)} | ${status} | ${b ? tests(b) : '—'} → ${h ? tests(h) : '—'} | ${secs(b?.seconds)} → ${secs(h?.seconds)}${delta(b?.seconds, h?.seconds, ' s')} | ${b?.cover != null ? b.cover.toFixed(1) + '%' : '—'} → ${h?.cover != null ? h.cover.toFixed(1) + '%' : '—'}${delta(b?.cover, h?.cover, ' pp')} |` };
              }).filter((r) => (r.h && (r.h.pass + r.h.fail + r.h.skip)) || (r.b && (r.b.pass + r.b.fail + r.b.skip)));
              const head5 = ['| Package | | Tests | Time | Coverage |', '| --- | --- | --- | --- | --- |'];
              const moved = table.filter((r) => r.changed);
              testLines.push('', `<details><summary>Per package: ${moved.length} changed, ${table.length} with tests</summary>`, '',
                ...head5, ...(moved.length ? moved : table).map((r) => r.row), '', '</details>');
            }

            // The markers are added by the write job.
            const lines = [
              `### CI: ${icon(run.conclusion)}`,
              `Commit: \`${run.head_sha.slice(0, 8)}\` · [Full log](${run.html_url})`,
              '',
            ];
            if (run.conclusion === 'action_required' || rows.length === 0) {
              lines.push('CI has not run on this commit yet: workflows from a first-time contributor wait for a maintainer to approve them.');
            } else {
              let complexity = '';
              try { complexity = fs.readFileSync('complexity.md', 'utf8').slice(0, 30000); } catch { /* advisory */ }
              lines.push('| Check | Result | Detail | Time |', '| --- | --- | --- | --- |', ...rows, '', ...testLines);
              if (complexity) lines.push(complexity);
            }

            // A job output holds up to 1 MB; a comment, 65536 characters.
            core.setOutput('body', lines.join('\n').slice(0, 60000));

  # Writes the report. One write job at a time per pull request
  # (cancel-in-progress: false queues them), and each one, inside the group:
  #   - stops unless the pull request is still at the run's commit, the run has
  #     no newer attempt, and no later CI run exists for that commit and head
  #     branch (a rerun, or a second run on the same commit, is fresher);
  #   - stops if the comment already carries a report from a later run or
  #     attempt: the first lines of the comment hold the run number and attempt
  #     it was written from, and a report only replaces an older one.
  # Since the group serialises them, the check and the write cannot interleave
  # with another report's. GitHub keeps one pending job per group: a third
  # report arriving while one runs and one waits cancels the waiting one, so a
  # report can be lost to a newer one, never overwrite it.
  write:
    needs: comment
    if: needs.comment.outputs.pr != '' && needs.comment.outputs.body != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: ci-report-pr-${{ needs.comment.outputs.pr }}
      cancel-in-progress: false
    steps:
      - name: Write the report, then ask Copilot to review
        uses: actions/github-script@v7
        env:
          PR: ${{ needs.comment.outputs.pr }}
          BODY: ${{ needs.comment.outputs.body }}
        with:
          script: |
            const marker = '<!-- vsp-ci-report -->';
            const { owner, repo } = context.repo;
            const run = context.payload.workflow_run;
            const prNumber = Number(process.env.PR);
            const lines = [];

            // --- only the latest run and attempt on this commit writes ------
            const now = (await github.rest.pulls.get({ owner, repo, pull_number: prNumber })).data;
            if (now.head.sha !== run.head_sha) {
              core.info(`#${prNumber} moved to ${now.head.sha}; this report for ${run.head_sha} is stale, not written`);
              return;
            }
            const self = (await github.rest.actions.getWorkflowRun({ owner, repo, run_id: run.id })).data;
            if (self.run_attempt > run.run_attempt) {
              core.info(`run ${run.id} has a newer attempt (${self.run_attempt} > ${run.run_attempt}); not written`);
              return;
            }
            const sameCommit = await github.paginate(github.rest.actions.listWorkflowRuns,
              { owner, repo, workflow_id: run.workflow_id, head_sha: run.head_sha, event: run.event, per_page: 100 });
            const newer = sameCommit.find((r) => r.id !== run.id
              && r.head_branch === run.head_branch
              && r.head_repository?.id === run.head_repository?.id
              && (r.run_number > run.run_number
                || (r.run_number === run.run_number && new Date(r.created_at) > new Date(run.created_at))));
            if (newer) {
              core.info(`a later run on ${run.head_sha} exists (run ${newer.id}, #${newer.run_number}, attempt ${newer.run_attempt}, ${newer.status}); this report from #${run.run_number} attempt ${run.run_attempt} is not written`);
              return;
            }

            // --- and the comment does not already hold a later report --------
            // The run marker is read only from the comment's first lines, which
            // this job writes; the rest of the body carries escaped PR content.
            const runMark = (b) => {
              const m = /^<!-- vsp-ci-report -->\n<!-- vsp-ci-report-run: (\d+)\.(\d+) -->\n/.exec(b || '');
              return m ? [Number(m[1]), Number(m[2])] : [0, 0];
            };
            const later = ([n1, a1], [n2, a2]) => n1 > n2 || (n1 === n2 && a1 > a2);
            const mine = [run.run_number, run.run_attempt];
            const comments = await github.paginate(github.rest.issues.listComments,
              { owner, repo, issue_number: prNumber });
            const existing = comments.find((c) => c.user?.login === 'github-actions[bot]' && c.body?.includes(marker));
            if (existing && later(runMark(existing.body), mine)) {
              core.info(`#${prNumber} already shows the report of run #${runMark(existing.body).join(' attempt ')}; this one from #${mine.join(' attempt ')} is older, not written`);
              return;
            }

            // --- Copilot review, once per commit, only on a green run ----------
            if (run.conclusion === 'success') {
              const reviews = await github.paginate(github.rest.pulls.listReviews, { owner, repo, pull_number: prNumber });
              const pending = await github.rest.pulls.listRequestedReviewers({ owner, repo, pull_number: prNumber })
                .then((r) => r.data.users || []).catch(() => []);
              const isCopilot = (login) => /copilot/i.test(login || '');
              const done = reviews.some((r) => isCopilot(r.user?.login) && r.commit_id === run.head_sha)
                || pending.some((u) => isCopilot(u.login));
              if (done) {
                lines.push('', '_Copilot review: already requested for this commit._');
              } else {
                let ok = false;
                for (const reviewer of ['copilot-pull-request-reviewer[bot]', 'Copilot']) {
                  try {
                    await github.rest.pulls.requestReviewers({ owner, repo, pull_number: prNumber, reviewers: [reviewer] });
                    ok = true; break;
                  } catch (e) { core.info(`requesting ${reviewer}: ${e.message}`); }
                }
                lines.push('', ok ? '_Tests passed: Copilot review requested._'
                  : '_Tests passed, but the Copilot review could not be requested automatically._');
              }
            }
            const body = [marker, `<!-- vsp-ci-report-run: ${run.run_number}.${run.run_attempt} -->`,
              process.env.BODY, ...lines].join('\n');
            if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body });
            core.info(`${existing ? 'updated' : 'created'} report on #${prNumber}`);
